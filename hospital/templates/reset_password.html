{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cambiar Contraseña - Hospital Regional Rancagua</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #5b21b6 0%, #7c3aed 50%, #a78bfa 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: 
        radial-gradient(circle at 20% 50%, rgba(167, 139, 250, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(196, 181, 253, 0.1) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    .reset-container {
      width: 100%;
      max-width: 450px;
      background: white;
      border-radius: 20px;
      padding: 3rem;
      box-shadow: 0 25px 70px rgba(124, 58, 237, 0.35);
      animation: fadeIn 0.6s ease-out;
      position: relative;
      z-index: 1;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .icon-section {
      text-align: center;
      margin-bottom: 2rem;
    }

    .icon-circle {
      width: 80px;
      height: 80px;
      margin: 0 auto 1rem;
      background: linear-gradient(135deg, #7c3aed 0%, #a78bfa 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 20px rgba(124, 58, 237, 0.4);
    }

    .icon-circle i {
      font-size: 2.5rem;
      color: white;
    }

    h1 {
      font-size: 1.5rem;
      color: #5b21b6;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }

    .subtitle {
      color: #6d28d9;
      font-size: 0.9rem;
      margin-bottom: 0.5rem;
    }

    .user-badge {
      display: inline-block;
      background: rgba(124, 58, 237, 0.15);
      color: #7c3aed;
      padding: 0.5rem 1rem;
      border-radius: 20px;
      font-weight: 600;
      margin-bottom: 2rem;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    .form-label {
      font-size: 0.85rem;
      font-weight: 600;
      color: #5b21b6;
      margin-bottom: 0.5rem;
      display: block;
    }

    .input-group-custom {
      position: relative;
    }

    .form-control {
      width: 100%;
      padding: 0.9rem 3rem 0.9rem 1rem;
      border: 2px solid #e8ecef;
      border-radius: 10px;
      font-size: 0.95rem;
      transition: all 0.3s ease;
      background: #f8f9fa;
    }

    .form-control:focus {
      outline: none;
      border-color: #a78bfa;
      background: white;
      box-shadow: 0 0 0 4px rgba(167, 139, 250, 0.15);
    }

    .toggle-password {
      position: absolute;
      right: 1rem;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      color: #95a5a6;
      transition: color 0.3s ease;
    }

    .toggle-password:hover {
      color: #7c3aed;
    }

    .password-requirements {
      font-size: 0.75rem;
      color: #7f8c8d;
      margin-top: 0.5rem;
    }

    .btn-submit {
      width: 100%;
      padding: 1rem;
      background: linear-gradient(135deg, #7c3aed 0%, #a78bfa 100%);
      border: none;
      border-radius: 10px;
      color: white;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 6px 20px rgba(124, 58, 237, 0.4);
    }

    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(124, 58, 237, 0.5);
      background: linear-gradient(135deg, #6d28d9 0%, #8b5cf6 100%);
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 1.5rem;
      color: #7c3aed;
      text-decoration: none;
      font-size: 0.9rem;
      transition: color 0.3s ease;
    }

    .back-link:hover {
      color: #5b21b6;
    }

    .alert {
      border-radius: 10px;
      border: none;
      margin-bottom: 1.5rem;
      animation: shake 0.5s ease-out;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-10px); }
      75% { transform: translateX(10px); }
    }
  </style>
</head>
<body>
  <div class="reset-container">
    <div class="icon-section">
      <div class="icon-circle">
        <i class="fas fa-lock"></i>
      </div>
      <h1>Cambiar Contraseña</h1>
      <p class="subtitle">Ingresa tu nueva contraseña</p>
      <span class="user-badge">
        <i class="fas fa-user me-1"></i>{{ usuario }}
      </span>
    </div>

    {% if error %}
      <div class="alert alert-danger" role="alert">
        <i class="fas fa-exclamation-circle me-2"></i>{{ error }}
      </div>
    {% endif %}

    <form action="{% url 'reset_password' %}" method="post">
      {% csrf_token %}
      
      <div class="form-group">
        <label class="form-label">Nueva Contraseña</label>
        <div class="input-group-custom">
          <input type="password" name="nueva_clave" id="nueva_clave" class="form-control" placeholder="Ingresa tu nueva contraseña" required autofocus>
          <i class="fas fa-eye toggle-password" onclick="togglePassword('nueva_clave', this)"></i>
        </div>
        <div class="password-requirements">
          <i class="fas fa-info-circle me-1"></i>Mínimo 4 caracteres
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Confirmar Contraseña</label>
        <div class="input-group-custom">
          <input type="password" name="confirmar_clave" id="confirmar_clave" class="form-control" placeholder="Confirma tu nueva contraseña" required>
          <i class="fas fa-eye toggle-password" onclick="togglePassword('confirmar_clave', this)"></i>
        </div>
      </div>

      <button type="submit" class="btn-submit">
        <i class="fas fa-check me-2"></i>Cambiar Contraseña
      </button>
    </form>

    <a href="{% url 'index' %}" class="back-link">
      <i class="fas fa-arrow-left me-1"></i>Volver al inicio de sesión
    </a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    function togglePassword(inputId, icon) {
      const passwordInput = document.getElementById(inputId);
      
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
      } else {
        passwordInput.type = 'password';
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
      }
    }
  </script>
</body>
</html>
