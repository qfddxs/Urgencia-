{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirmar Borrado - Hospital Regional Rancagua</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background: linear-gradient(135deg, #0f766e 0%, #0891b2 50%, #0284c7 100%);
      min-height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .delete-container {
      width: 100%;
      max-width: 550px;
      background: white;
      border-radius: 20px;
      padding: 3rem;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      animation: fadeIn 0.6s ease-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .icon-section {
      text-align: center;
      margin-bottom: 2rem;
    }

    .icon-circle {
      width: 80px;
      height: 80px;
      margin: 0 auto 1rem;
      background: linear-gradient(135deg, #dc2626 0%, #b91c1c 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
        box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.4);
      }
      50% {
        transform: scale(1.05);
        box-shadow: 0 0 0 20px rgba(220, 38, 38, 0);
      }
    }

    .icon-circle i {
      font-size: 2.5rem;
      color: white;
    }

    h1 {
      font-size: 1.5rem;
      color: #2c3e50;
      font-weight: 700;
      margin-bottom: 1rem;
    }

    .warning-text {
      color: #7f8c8d;
      font-size: 0.95rem;
      margin-bottom: 0.5rem;
    }

    .derivacion-info {
      background: rgba(220, 38, 38, 0.1);
      border-left: 4px solid #dc2626;
      padding: 1rem;
      border-radius: 8px;
      margin: 1.5rem 0;
      text-align: left;
    }

    .derivacion-info strong {
      color: #dc2626;
    }

    .alert-text {
      color: #dc2626;
      font-weight: 600;
      margin-bottom: 2rem;
    }

    .btn-delete {
      width: 100%;
      padding: 1rem;
      background: linear-gradient(135deg, #dc2626 0%, #b91c1c 100%);
      border: none;
      border-radius: 10px;
      color: white;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(220, 38, 38, 0.4);
      margin-bottom: 0.75rem;
    }

    .btn-delete:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 25px rgba(220, 38, 38, 0.5);
    }

    .btn-cancel {
      width: 100%;
      padding: 1rem;
      background: rgba(15, 118, 110, 0.1);
      border: 2px solid #0f766e;
      border-radius: 10px;
      color: #0f766e;
      font-size: 1rem;
      font-weight: 600;
      text-decoration: none;
      display: inline-block;
      transition: all 0.3s ease;
      text-align: center;
    }

    .btn-cancel:hover {
      background: rgba(15, 118, 110, 0.2);
      color: #0f766e;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="delete-container">
    <div class="icon-section">
      <div class="icon-circle">
        <i class="fas fa-exclamation-triangle"></i>
      </div>
      <h1>¿Estás seguro?</h1>
      <p class="warning-text">Esta acción es irreversible</p>
    </div>

    <div class="derivacion-info">
      <p class="mb-2">
        <i class="fas fa-file-medical me-2"></i>
        <strong>Derivación #{{ derivacion.id_derivacion }}</strong>
      </p>
      <p class="mb-0">
        <i class="fas fa-user me-2"></i>
        Paciente: <strong>{{ derivacion.paciente.nombre }}</strong>
      </p>
    </div>

    <p class="alert-text text-center">
      <i class="fas fa-exclamation-circle me-1"></i>
      Esta acción no se puede deshacer
    </p>
    
    <form method="POST" action="{% url 'borrar_derivacion' derivacion.id_derivacion %}">
      {% csrf_token %}
      <button type="submit" class="btn-delete">
        <i class="fas fa-trash-alt me-2"></i>Sí, borrar derivación
      </button>
    </form>
    
    <a href="{% url 'ver_derivaciones' %}" class="btn-cancel">
      <i class="fas fa-arrow-left me-2"></i>Cancelar y volver
    </a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
