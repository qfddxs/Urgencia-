{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrar Ficha de Paciente</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'style.css' %}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background: linear-gradient(to bottom, #f8f9fa 0%, #e9ecef 100%);
      min-height: 100vh;
    }
    
    .card {
      border-radius: 20px;
      border: none;
    }
    
    .card-header {
      background: #6c5ce7;
      color: white;
      border-radius: 20px 20px 0 0;
      padding: 2rem;
    }
    
    .form-control, .form-select {
      border-radius: 10px;
      border: 2px solid #e9ecef;
      padding: 12px 16px;
      transition: all 0.3s ease;
    }
    
    .form-control:focus, .form-select:focus {
      border-color: #6c5ce7;
      box-shadow: 0 0 0 4px rgba(108, 92, 231, 0.1);
      transform: translateY(-2px);
    }
    
    .btn-primary {
      background: #6c5ce7;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-weight: 500;
      transition: all 0.3s ease;
    }
    
    .btn-primary:hover {
      background: #5f4fd1;
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(108, 92, 231, 0.3);
    }
    
    fieldset {
      background: white;
      border: 2px solid #f1f3f5;
      border-radius: 16px;
      padding: 2rem;
      margin-bottom: 1.5rem;
    }
    
    legend {
      background: #6c5ce7;
      color: white;
      padding: 8px 20px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 1rem;
      width: auto;
      margin-bottom: 0;
    }
    
    label {
      font-weight: 500;
      color: #495057;
      margin-bottom: 0.5rem;
    }
    
    .form-text {
      color: #6c757d;
      font-size: 0.875rem;
    }
  </style>
</head>
<body class="bg-light">
  <div class="container my-5">
    <div class="card shadow-lg border-0">
      <div class="card-header border-0 py-4">
        <div class="d-flex align-items-center">
          <i class="fa fa-user-plus fa-2x me-3"></i>
          <div>
            <h1 class="mb-0">Registrar Ficha de Paciente</h1>
            <small>Complete todos los datos del paciente</small>
          </div>
        </div>
      </div>
      <div class="card-body p-4">
        <form method="POST" action="{% url 'ficha_paciente' %}">
          {% csrf_token %}
          
          <fieldset class="mb-4">
            <legend><i class="fa fa-user"></i> Datos del Paciente</legend>
            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="rut" class="form-label fw-bold">
                  <i class="fa fa-id-card text-primary"></i> RUT
                </label>
                <input type="text" id="rut" name="rut" class="form-control" 
                       placeholder="Ej: 12345678-9" required>
              </div>
              <div class="col-md-6 mb-3">
                <label for="nombre" class="form-label fw-bold">
                  <i class="fa fa-signature text-primary"></i> Nombre Completo
                </label>
                <input type="text" id="nombre" name="nombre" class="form-control" 
                       placeholder="Ej: Juan Pérez González" required>
              </div>
            </div>
            <div class="row">
              <div class="col-md-4 mb-3">
                <label for="edad" class="form-label fw-bold">
                  <i class="fa fa-calendar text-primary"></i> Edad
                </label>
                <input type="number" id="edad" name="edad" class="form-control" 
                       placeholder="Ej: 45" min="0" max="120" required>
              </div>
              <div class="col-md-4 mb-3">
                <label for="genero" class="form-label fw-bold">
                  <i class="fa fa-venus-mars text-primary"></i> Género
                </label>
                <select id="genero" name="genero" class="form-select">
                  <option value="">Seleccionar...</option>
                  <option value="Masculino">Masculino</option>
                  <option value="Femenino">Femenino</option>
                  <option value="Otro">Otro</option>
                </select>
              </div>
              <div class="col-md-4 mb-3">
                <label for="prevision" class="form-label fw-bold">
                  <i class="fa fa-hospital text-primary"></i> Previsión
                </label>
                <select id="prevision" name="prevision" class="form-select">
                  <option value="">Seleccionar...</option>
                  <option value="Fonasa">Fonasa</option>
                  <option value="Isapre">Isapre</option>
                  <option value="Particular">Particular</option>
                  <option value="Otro">Otro</option>
                </select>
              </div>
            </div>
          </fieldset>

          <fieldset class="mb-4">
            <legend><i class="fa fa-notes-medical"></i> Condiciones Clínicas</legend>
            <div class="mb-3">
              <label for="comorbilidades" class="form-label fw-bold">
                <i class="fa fa-heartbeat text-danger"></i> Comorbilidades
              </label>
              <textarea id="comorbilidades" name="comorbilidades" class="form-control" rows="3"
                        placeholder="Ej: Diabetes tipo 2, Hipertensión arterial"></textarea>
              <small class="text-muted">Ingrese las enfermedades o condiciones previas del paciente</small>
            </div>
            <div class="mb-3">
              <label for="funcionalidad" class="form-label fw-bold">
                <i class="fa fa-walking text-success"></i> Funcionalidad
              </label>
              <select id="funcionalidad" name="funcionalidad" class="form-select">
                <option value="">Seleccionar...</option>
                <option value="Autovalente">Autovalente</option>
                <option value="Dependencia Leve">Dependencia Leve</option>
                <option value="Dependencia Moderada">Dependencia Moderada</option>
                <option value="Dependencia Severa">Dependencia Severa</option>
              </select>
              <small class="text-muted">Nivel de independencia del paciente</small>
            </div>
          </fieldset>

          <div class="d-grid gap-2">
            <button type="submit" class="btn btn-primary btn-lg py-3">
              <i class="fa fa-save"></i> Guardar Ficha del Paciente
            </button>
            <a href="{% url 'tens' %}" class="btn btn-outline-secondary">
              <i class="fa fa-arrow-left"></i> Volver al Menú TENS
            </a>
          </div>
        </form>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Validación de RUT en tiempo real
    document.getElementById('rut').addEventListener('input', function(e) {
      let value = e.target.value.replace(/[^0-9kK]/g, '');
      if (value.length > 1) {
        value = value.slice(0, -1) + '-' + value.slice(-1);
      }
      e.target.value = value;
    });

    // Animación de entrada
    document.addEventListener('DOMContentLoaded', function() {
      const fieldsets = document.querySelectorAll('fieldset');
      fieldsets.forEach((fieldset, index) => {
        fieldset.style.opacity = '0';
        fieldset.style.transform = 'translateY(20px)';
        setTimeout(() => {
          fieldset.style.transition = 'all 0.5s ease';
          fieldset.style.opacity = '1';
          fieldset.style.transform = 'translateY(0)';
        }, index * 200);
      });
    });
  </script>
</body>
</html>
