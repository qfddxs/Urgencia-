{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrar Derivación</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'style.css' %}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 2rem 0;
    }

    .form-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 24px;
      padding: 2.5rem;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.18);
      animation: fadeInUp 0.6s ease-out;
    }

    .form-header {
      margin-bottom: 2rem;
      padding-bottom: 1.5rem;
      border-bottom: 2px solid #f1f3f5;
    }

    .form-header h1 {
      color: #1e293b;
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }

    .section-box {
      background: #f8f9fa;
      border-radius: 16px;
      padding: 2rem;
      margin-bottom: 2rem;
    }

    .section-title {
      color: #667eea;
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .section-title i {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 0.9rem;
    }

    .form-control, .form-select, textarea {
      border: 2px solid #e9ecef;
      border-radius: 12px;
      padding: 0.875rem 1rem;
      transition: all 0.3s ease;
      background: white;
    }

    .form-control:focus, .form-select:focus, textarea:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
      transform: translateY(-2px);
    }

    .form-label {
      font-weight: 600;
      color: #475569;
      margin-bottom: 0.5rem;
      font-size: 0.95rem;
    }

    .hospital-option {
      padding: 0.875rem 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .btn-submit {
      background: linear-gradient(135deg, #00b894 0%, #00cec9 100%);
      border: none;
      border-radius: 12px;
      padding: 1rem;
      font-weight: 600;
      color: white;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .btn-submit::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.3);
      transform: translate(-50%, -50%);
      transition: width 0.6s, height 0.6s;
    }

    .btn-submit:hover::before {
      width: 400px;
      height: 400px;
    }

    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0, 184, 148, 0.4);
    }

    .btn-back {
      background: rgba(100, 116, 139, 0.1);
      color: #64748b;
      border: none;
      border-radius: 12px;
      padding: 1rem;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .btn-back:hover {
      background: #64748b;
      color: white;
      transform: translateY(-2px);
    }

    .alert-error {
      background: rgba(239, 68, 68, 0.1);
      border: 2px solid #ef4444;
      border-radius: 12px;
      padding: 1rem;
      color: #991b1b;
      margin-bottom: 2rem;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="container" style="max-width: 900px;">
    <div class="form-card">
      <div class="form-header">
        <h1><i class="fa fa-hospital me-2" style="color: #667eea;"></i>Registrar Derivación</h1>
        <p style="color: #64748b; margin: 0;">Complete la información para derivar al paciente</p>
      </div>

      {% if error %}
        <div class="alert-error">
          <i class="fa fa-exclamation-triangle me-2"></i>
          <strong>Error:</strong> {{ error }}
        </div>
      {% endif %}

      <form method="POST" action="{% url 'registrar_derivacion' %}">
        {% csrf_token %}
        
        <!-- Información de la Derivación -->
        <div class="section-box">
          <div class="section-title">
            <i class="fa fa-notes-medical"></i>
            <span>Información de la Derivación</span>
          </div>
          
          <div class="mb-3">
            <label for="paciente-rut" class="form-label">
              <i class="fa fa-user me-2" style="color: #667eea;"></i>Paciente
            </label>
            <select id="paciente-rut" name="paciente_rut" class="form-select" required>
              <option value="">Seleccionar paciente...</option>
              {% for paciente in pacientes %}
                <option value="{{ paciente.rut }}">
                  {{ paciente.nombre }} (RUT: {{ paciente.rut }})
                </option>
              {% endfor %}
            </select>
          </div>

          <div class="mb-3">
            <label for="motivo" class="form-label">
              <i class="fa fa-file-medical me-2" style="color: #667eea;"></i>Motivo de la Derivación
            </label>
            <textarea id="motivo" name="motivo" class="form-control" rows="4" 
                      placeholder="Describa detalladamente el motivo de la derivación..." required></textarea>
          </div>

          <div class="mb-3">
            <label for="prestacion" class="form-label">
              <i class="fa fa-stethoscope me-2" style="color: #667eea;"></i>Prestación Requerida
            </label>
            <input type="text" id="prestacion" name="prestacion" class="form-control" 
                   placeholder="Ej: Cirugía, Cardiología, UCI" required>
          </div>
        </div>

        <!-- Hospital Receptor -->
        <div class="section-box">
          <div class="section-title">
            <i class="fa fa-hospital-alt"></i>
            <span>Hospital Receptor</span>
          </div>

          <div class="mb-3">
            <label for="hospital" class="form-label">
              <i class="fa fa-map-marker-alt me-2" style="color: #667eea;"></i>Seleccione Hospital
            </label>
            <select class="form-select" name="hospital" id="hospital" required>
              <option value="">Seleccionar hospital...</option>
              {% for hospital in hospitales %}
                <option value="{{ hospital.id_hospital }}">
                  {{ hospital.nombre }} 
                  {% if hospital.camas_disponibles > 5 %}
                    (✓ {{ hospital.camas_disponibles }} camas disponibles)
                  {% elif hospital.camas_disponibles > 0 %}
                    (⚠ {{ hospital.camas_disponibles }} camas disponibles)
                  {% else %}
                    (✗ Sin camas disponibles)
                  {% endif %}
                </option>
              {% endfor %}
            </select>
            <small style="color: #64748b; font-size: 0.875rem; display: block; margin-top: 0.5rem;">
              <i class="fa fa-info-circle me-1"></i>
              Seleccione el hospital de destino según disponibilidad
            </small>
          </div>
        </div>

        <!-- Botones -->
        <div class="row g-3">
          <div class="col-md-8">
            <button type="submit" class="btn btn-submit w-100">
              <i class="fa fa-paper-plane me-2"></i>Enviar Derivación
            </button>
          </div>
          <div class="col-md-4">
            <a href="{% url 'medico' %}" class="btn btn-back w-100">
              <i class="fa fa-arrow-left me-2"></i>Cancelar
            </a>
          </div>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
